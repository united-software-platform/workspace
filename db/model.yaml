version: 1
tables:
  - name: model_meta
    columns:
      - name: model
        type: string
        length: 64
        nullable: false
      - name: version
        type: string
        length: 32
        nullable: false
    primary_key: [model]

  - name: model_history
    columns:
      - name: model
        type: string
        length: 64
        nullable: false
      - name: version
        type: string
        length: 32
        nullable: false
      - name: date
        type: date
        nullable: false
      - name: source
        type: text
        nullable: false
      - name: summary
        type: text
        nullable: false
    primary_key: [model, version]
    foreign_keys:
      - columns: [model]
        references: {table: model_meta, columns: [model]}

  - name: organization
    columns:
      - name: id
        type: string
        length: 128
        nullable: false
      - name: name
        type: text
        nullable: false
      - name: deprecated
        type: boolean
        nullable: false
      - name: replaced_by_id
        type: string
        length: 128
        nullable: true
      - name: owned
        type: boolean
        nullable: false
    primary_key: [id]
    foreign_keys:
      - columns: [replaced_by_id]
        references: {table: organization, columns: [id]}

  - name: organization_synonym
    columns:
      - name: organization_id
        type: string
        length: 128
        nullable: false
      - name: synonym
        type: text
        nullable: false
    primary_key: [organization_id, synonym]
    foreign_keys:
      - columns: [organization_id]
        references: {table: organization, columns: [id]}

  - name: project_group
    columns:
      - name: id
        type: string
        length: 128
        nullable: false
      - name: name
        type: text
        nullable: false
      - name: deprecated
        type: boolean
        nullable: false
      - name: replaced_by_id
        type: string
        length: 128
        nullable: true
    primary_key: [id]
    foreign_keys:
      - columns: [replaced_by_id]
        references: {table: project_group, columns: [id]}

  - name: project_group_synonym
    columns:
      - name: project_group_id
        type: string
        length: 128
        nullable: false
      - name: synonym
        type: text
        nullable: false
    primary_key: [project_group_id, synonym]
    foreign_keys:
      - columns: [project_group_id]
        references: {table: project_group, columns: [id]}

  - name: technology_kind
    columns:
      - name: id
        type: string
        length: 32
        nullable: false
      - name: name
        type: text
        nullable: false
    primary_key: [id]

  - name: technology
    columns:
      - name: id
        type: string
        length: 128
        nullable: false
      - name: name
        type: text
        nullable: false
      - name: kind_id
        type: string
        length: 32
        nullable: false
      - name: deprecated
        type: boolean
        nullable: false
      - name: replaced_by_id
        type: string
        length: 128
        nullable: true
    primary_key: [id]
    foreign_keys:
      - columns: [kind_id]
        references: {table: technology_kind, columns: [id]}
      - columns: [replaced_by_id]
        references: {table: technology, columns: [id]}

  - name: technology_synonym
    columns:
      - name: technology_id
        type: string
        length: 128
        nullable: false
      - name: synonym
        type: text
        nullable: false
    primary_key: [technology_id, synonym]
    foreign_keys:
      - columns: [technology_id]
        references: {table: technology, columns: [id]}

  - name: domain
    columns:
      - name: id
        type: string
        length: 128
        nullable: false
      - name: name
        type: text
        nullable: false
      - name: deprecated
        type: boolean
        nullable: false
      - name: replaced_by_id
        type: string
        length: 128
        nullable: true
    primary_key: [id]
    foreign_keys:
      - columns: [replaced_by_id]
        references: {table: domain, columns: [id]}

  - name: domain_synonym
    columns:
      - name: domain_id
        type: string
        length: 128
        nullable: false
      - name: synonym
        type: text
        nullable: false
    primary_key: [domain_id, synonym]
    foreign_keys:
      - columns: [domain_id]
        references: {table: domain, columns: [id]}

  - name: role
    columns:
      - name: id
        type: string
        length: 128
        nullable: false
      - name: name
        type: text
        nullable: false
      - name: deprecated
        type: boolean
        nullable: false
      - name: replaced_by_id
        type: string
        length: 128
        nullable: true
    primary_key: [id]
    foreign_keys:
      - columns: [replaced_by_id]
        references: {table: role, columns: [id]}

  - name: role_synonym
    columns:
      - name: role_id
        type: string
        length: 128
        nullable: false
      - name: synonym
        type: text
        nullable: false
    primary_key: [role_id, synonym]
    foreign_keys:
      - columns: [role_id]
        references: {table: role, columns: [id]}

  - name: origin
    columns:
      - name: id
        type: string
        length: 32
        nullable: false
      - name: name
        type: text
        nullable: false
    primary_key: [id]

  - name: project_status
    columns:
      - name: id
        type: string
        length: 32
        nullable: false
      - name: name
        type: text
        nullable: false
    primary_key: [id]

  - name: project
    columns:
      - name: name
        type: string
        length: 255
        nullable: false
      - name: path
        type: text
        nullable: true
      - name: purpose
        type: text
        nullable: false
      - name: origin_id
        type: string
        length: 32
        nullable: false
      - name: organization_id
        type: string
        length: 128
        nullable: false
      - name: group_id
        type: string
        length: 128
        nullable: true
      - name: customer_id
        type: string
        length: 128
        nullable: true
      - name: period_from
        type: integer
        nullable: false
      - name: period_to
        type: integer
        nullable: true
      - name: status_id
        type: string
        length: 32
        nullable: false
    primary_key: [name]
    unique:
      - [path]
    foreign_keys:
      - columns: [origin_id]
        references: {table: origin, columns: [id]}
      - columns: [organization_id]
        references: {table: organization, columns: [id]}
      - columns: [group_id]
        references: {table: project_group, columns: [id]}
      - columns: [customer_id]
        references: {table: organization, columns: [id]}
      - columns: [status_id]
        references: {table: project_status, columns: [id]}

  - name: project_technology
    columns:
      - name: project_name
        type: string
        length: 255
        nullable: false
      - name: technology_id
        type: string
        length: 128
        nullable: false
    primary_key: [project_name, technology_id]
    foreign_keys:
      - columns: [project_name]
        references: {table: project, columns: [name]}
      - columns: [technology_id]
        references: {table: technology, columns: [id]}

  - name: project_domain
    columns:
      - name: project_name
        type: string
        length: 255
        nullable: false
      - name: domain_id
        type: string
        length: 128
        nullable: false
    primary_key: [project_name, domain_id]
    foreign_keys:
      - columns: [project_name]
        references: {table: project, columns: [name]}
      - columns: [domain_id]
        references: {table: domain, columns: [id]}

  - name: project_role
    columns:
      - name: project_name
        type: string
        length: 255
        nullable: false
      - name: role_id
        type: string
        length: 128
        nullable: false
    primary_key: [project_name, role_id]
    foreign_keys:
      - columns: [project_name]
        references: {table: project, columns: [name]}
      - columns: [role_id]
        references: {table: role, columns: [id]}
