apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "workspace.fullname" . }}-postgres
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workspace.fullname" . }}-postgres
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "workspace.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "workspace.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ required "postgres.password обязателен — mise run k3s-apply читает POSTGRES_PASSWORD из .env" .Values.postgres.password | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "workspace.fullname" . }}-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "workspace.fullname" . }}-postgres
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  # Доступ без публикации портов — ENV-003: kubectl port-forward на время обращения
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "workspace.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
