# Зонтичный чарт workspace: сервисы общего набора — ENV-007, rules/environment.md.
# Неймспейс применения задаётся при установке (mise run k3s-apply, переменная WORKSPACE_NAMESPACE),
# а не в values: один чарт ставится разным потребителям без правки values.
#
# Каждая позиция services ставится парой Deployment + Service (ClusterIP, без публикации портов).
# Пример:
#
# services:
#   - name: example
#     image: ghcr.io/united-software-platform/example:1.0.0
#     replicas: 1
#     ports:
#       - name: http
#         port: 8080
#     env:
#       - name: SOME_VAR
#         value: some-value
services: []
