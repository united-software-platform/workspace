# Правила линтера формулировок BR (RU) для операции requirement-add.
# Формат: rules: [{name, pattern (regex, python), hint, error}].
# Починки при переносе в репозиторий (2026-11-22):
#   E1: добавлены границы слова (\bPR\b и т.д.) — раньше «PR» ложно совпадало
#       с «Proposed», «принята»;
#   D1: вставка «прошлых» между «известных» и «работах» больше не разрывает
#       паттерн — реальная малая выборка «на трёх известных прошлых работах»
#       раньше пропускалась.
# Пополнение change'ом add-multilevel-requirements-validation (2026-11-22):
#   F1/F2 — категория «рецепт реализации» (формулировка диктует решение);
#   D3 — измеримость критерия (строка о критерии без числа и порога).
rules:
  # === Категория A: субъект и scope ===
  - name: "A1/A2: неопределённый субъект"
    pattern: '(?i)\b(бизнес|пользователь|система)\s+(должен|должна|должно)\b'
    hint: "Уточните роль: разработчик / тимлид / архитектор. 'Бизнес' — не роль в системе."
    error: false

  - name: "A2: притяжательное без антецедента"
    pattern: '(?i)\b(сво[йияех]|наш[аи]?|их)\s+(проект|работ|команд)'
    hint: "Уточните: личное пространство или корпоративное?"
    error: false

  - name: "A3: неограниченный scope"
    pattern: '(?i)(за\s+любой\s+период|во\s+всех\s+(своих\s+)?проектах|всегда|бесконечн)'
    hint: "Задайте границы: какие проекты проиндексированы, какой период доступен."
    error: true   # блокирующее

  # === Категория B: неопределённые понятия ===
  - name: "B1: ключевое понятие без определения"
    pattern: '(?i)(собранный\s+контекст|полный\s+контекст)'
    hint: "Определите в description: проект + период + суть + файлы + коммиты + флоу + источники."
    error: true

  - name: "B2: оценочные прилагательные"
    pattern: '(?i)\b(полн(ый|он|ота)|совпадает|разумн|удобн|быстр|эффективн|качественн|оптимальн)\b'
    hint: "Замените на измеримый критерий (число + единица + процедура проверки)."
    error: false

  - name: "B3: абстрактный глагол"
    pattern: '(?i)\b(находить|получать|собирать)\s+(работ|контекст|информаци)'
    hint: "Определите объект: что конкретно считается 'работой' (коммит? PR? ревью?)."
    error: false

  # === Категория C: смешение уровней ===
  - name: "C1: retrieval + synthesis в одном требовании"
    pattern: '(?i)(найти|находить|вернуть).{0,200}(как\s+(это\s+)?(было\s+)?сделан|способ\s+реализаци|объяснить)'
    hint: "Разделите на два BR: поиск артефактов (Must) и восстановление флоу (Should)."
    error: true

  # === Категория D: неизмеримые критерии ===
  - name: "D1: малая выборка"
    pattern: '(?i)(на\s+(трёх|трех|3|пяти|5)\s+(известных\s+|прошлых\s+)*(работах|кейсах|примерах))'
    hint: "Обоснуйте репрезентативность или увеличьте выборку (стратификация по стекам/периодам)."
    error: true

  - name: "D2: нет процедуры проверки"
    pattern: '(?i)проверка:\s*(?!.*(чек-лист|ревьюер|порог|метрик))'
    hint: "Добавьте: кто проверяет, по какому чек-листу, какой порог."
    error: false

  - name: "D3: критерий без измеримого порога"
    pattern: '(?i)^(?=.*(?:критер|проверк|успешн|успех))(?!.*\d)(?!.*(?:чек-лист|порог|метрик)).*$'
    hint: "Критерий без числа и порога неизмерим: назовите число, единицу и процедуру проверки."
    error: false

  - name: "D4: непроверяемый outcome"
    pattern: '(?i)(перестаёт\s+теряться|со\s+временем|в\s+долгосрочной\s+перспективе)'
    hint: "Это outcome-гипотеза, не критерий приёмки. Вынесите из success_criteria."
    error: false

  # === Категория E: ограничения и риски ===
  - name: "E1: нет scope источников"
    pattern: '(?i)(\bисточник|\bgit\b|\bPR\b|\bтикет|\bADR\b)'
    hint: "Явно перечислите источники: git + код + конфиги (+ PR). Без ADR/тикетов/owner."
    error: false

  - name: "E3: нет анти-галлюцинации"
    pattern: '(?i)(ссылк|цитат|первоисточник)'
    hint: "Добавьте: каждый тезис с ссылкой на первоисточник — 100%."
    error: false

  # === Категория F: рецепт реализации (решение в формулировке требования) ===
  - name: "F1: глагол решения"
    pattern: '(?i)(реализовать\b.{0,40}?\b(через|посредством|на\s+базе)|сделать\s+на\s+базе|использовать\s+(postgres|redis|opensearch|minio|docker|kubernetes|k8s|grpc)|писать\s+на\s+(go|python|rust|typescript)|создать\s+(таблицу|сервис|микросервис|очередь|индекс|бакет)|завести\s+(базу|postgres|redis|очередь))'
    hint: "Формулировка диктует решение — вынесите его из требования в дизайн; требование описывает потребность."
    error: false

  - name: "F2: явная технология"
    pattern: '(?i)\b(postgres(ql)?|redis|opensearch|elasticsearch|minio|kafka|rabbitmq|docker|kubernetes|k8s|react|vue|grpc|graphql)\b'
    hint: "Технология в тексте требования — вероятный рецепт реализации; роль упоминания оценивает семантическая проверка (задача 2.5 шаблона)."
    error: false

  # === Общие «запахи» формулировок ===
  - name: "weak-modal"
    pattern: '(?i)\b(следует|может|мог\s+бы|желательно|по\s+возможности|при\s+необходимости)\b'
    hint: "Замените на обязывающее 'должен' или уберите."
    error: false

  - name: "vague-pronoun"
    pattern: '(?i)\b(это|оно|они|данный|такой)\b'
    hint: "Уточните антецедент."
    error: false
