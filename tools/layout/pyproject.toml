[project]
name = "domain-layout"
dynamic = ["version"]
description = "CLI-раскладка проектов по доменной классификации: каталог принятого прогона classify → дерево projects/<L1>/<L2>/<проект> и реестр происхождения"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
layout = "layout.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# Номер версии хранится только в VERSION: релизный коммит меняет один файл
[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\d+\\.\\d+\\.\\d+)"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "VERSION" }]

[tool.hatch.build.targets.wheel]
packages = ["src/layout"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
