include:
  # >>> liquibase-forge
  # Сервисы инструмента Liquibase Forge (БД и Liquibase) объявлены в собственном файле
  # docker/lbfr/docker-compose.yaml и здесь только подключаются. Файл лежит вне корня, чтобы
  # Compose находил в корне один файл — этот. project_directory — корень проекта: относительные
  # пути и .env подключаемого файла берутся от корня. Нужен Compose 2.20+
  - path: docker/lbfr/docker-compose.yaml
    project_directory: .
  # <<< liquibase-forge

services:
  claude:
    # Опубликованный образ окружения агента: собирает и проверяет его пайплайн репозитория
    # kit'а, проект получает готовый образ из реестра. Секции сборки здесь нет — исходник
    # образа в поставку не входит, и описание сборки ссылалось бы на отсутствующий файл.
    #
    # Имя, тег и digest вынесены в переменные: закрепить конкретную версию или состав, подставить
    # свою сборку можно в .env, не редактируя этот файл, — правка пережила бы не всякую
    # переустановку kit'а.
    #
    # Тег переставляет каждая пересборка, поэтому побайтовую неизменность образа даёт только
    # digest: SDD_KIT_IMAGE_DIGEST дописывается к ссылке и, будучи заданным, определяет образ
    # независимо от тега. Разделитель @ входит в значение переменной, а не в эту строку: пустая
    # переменная иначе оставила бы в ссылке висящий разделитель.
    image: ${SDD_KIT_IMAGE:-ghcr.io/united-software-platform/sdd-developer-kit}:${SDD_KIT_IMAGE_TAG:-latest}${SDD_KIT_IMAGE_DIGEST:-}
    # Отдельный compose-профиль: `docker compose up` сервисов окружения агента не поднимает
    profiles: ["claude"]
    # Команда по умолчанию — сам агент; аргумент после имени сервиса её заменяет (bash, git, …)
    command: claude
    working_dir: ${PROJECT_DIR:-/app}
    env_file: .env
    # Имя хоста для раннера целей make: на Linux host.docker.internal сам не резолвится
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Консолидирует весь конфиг (.claude.json, .credentials.json)
      # в смонтированный каталог аккаунта, иначе авторизация слетает
      CLAUDE_CONFIG_DIR: ${CLAUDE_CONFIG_DIR:-/home/claude/.claude}

    volumes:
      - .:${PROJECT_DIR:-/app}                                             # рабочее дерево проекта
      # Профиль задаёт каталог аккаунта: он берётся из .env или из переменной окружения
      # команды запуска сессии. Значение по умолчанию намеренно указывает на несуществующий
      # подкаталог: без профиля путь схлопнулся бы в каталог всех аккаунтов и агент увидел бы
      # чужие профили — вместо этого он получает пустой каталог конфигурации
      - ${CLAUDE_ACCOUNTS_DIR:-.claude-accounts}/${CLAUDE_PROFILE:-personal}:${CLAUDE_CONFIG_DIR:-/home/claude/.claude}
      - ${PROJECT_DIR:-/app}/${CLAUDE_ACCOUNTS_DIR:-.claude-accounts}      # анонимный том прячет чужие профили внутри контейнера
      - ${SSH_DIR:-.ssh}:${CONTAINER_SSH_DIR:-/home/claude/.ssh}           # ключи для работы с репозиторием
      # Файл секретов скрыт от агента: значения приезжают через env_file,
      # сам .env внутри контейнера пустой. compose читает его на хосте — маскировка не мешает
      - /dev/null:${PROJECT_DIR:-/app}/.env:ro
  codex:
    # Опубликованный образ окружения Codex: собирает его пайплайн репозитория codex-box.
    # Имя, тег и digest вынесены в переменные тем же порядком, что и у сервиса claude:
    # закрепить версию или подставить свою сборку можно в .env, не редактируя этот файл.
    # Разделитель @ входит в значение CODEX_BOX_IMAGE_DIGEST, а не в эту строку.
    image: ${CODEX_BOX_IMAGE:-ghcr.io/united-software-platform/codex-box}:${CODEX_BOX_IMAGE_TAG:-latest}${CODEX_BOX_IMAGE_DIGEST:-}
    # Отдельный compose-профиль: `docker compose up` сервиса Codex не поднимает
    profiles: ["codex"]
    # Команда по умолчанию — сам агент; аргумент после имени сервиса её заменяет (bash, git, …)
    command: codex
    working_dir: ${PROJECT_DIR:-/app}
    # Имя хоста для раннера целей make: на Linux host.docker.internal сам не резолвится
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Каталог конфигурации Codex (config.toml, auth.json) — смонтированный каталог аккаунта
      CODEX_HOME: ${CODEX_HOME:-/home/codex/.codex}
      # Доступ Codex к разрешённым целям раннера на хосте. Значения берутся из .env хоста.
      AGENT_RUNNER_PORT: ${AGENT_RUNNER_PORT}
      AGENT_RUNNER_URL: ${AGENT_RUNNER_URL}
      AGENT_RUNNER_TOKEN: ${AGENT_RUNNER_TOKEN}

    volumes:
      - .:${PROJECT_DIR:-/app}                                             # рабочее дерево проекта
      # Профиль задаёт каталог аккаунта Codex. Значение по умолчанию намеренно указывает
      # на несуществующий подкаталог: без профиля агент получает пустой каталог конфигурации,
      # а не каталог всех аккаунтов
      - ${CODEX_ACCOUNTS_DIR:-.codex-accounts}/${CODEX_PROFILE:-__no_profile__}:${CODEX_HOME:-/home/codex/.codex}
      # Анонимные тома прячут внутри контейнера каталоги аккаунтов — и свои, и Claude Code
      - ${PROJECT_DIR:-/app}/${CODEX_ACCOUNTS_DIR:-.codex-accounts}
      - ${PROJECT_DIR:-/app}/${CLAUDE_ACCOUNTS_DIR:-.claude-accounts}
      - ${SSH_DIR:-.ssh}:/home/codex/.ssh                                  # ключи для работы с репозиторием
      # Файл секретов скрыт от агента: compose читает его на хосте, внутри контейнера он пустой
      - /dev/null:${PROJECT_DIR:-/app}/.env:ro