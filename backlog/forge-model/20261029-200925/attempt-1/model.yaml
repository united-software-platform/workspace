version: 1
tables:
  - name: project_domain
    columns:
      - name: id
        type: bigint
        generated: identity
      - name: uuid
        type: uuid
        nullable: false
      - name: code
        type: string
        length: 64
        nullable: false
      - name: name_ru
        type: string
        length: 255
        nullable: false
